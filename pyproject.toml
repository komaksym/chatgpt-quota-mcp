[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-quota-mcp"
version = "0.1.0"
description = "Personal MCP tool for reading ChatGPT/Codex quota through Codex CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3"]

[project.optional-dependencies]
dev = [
    "mypy>=1.18,<2",
    "pytest>=9,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
chatgpt-quota-mcp = "chatgpt_quota_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["chatgpt_quota_mcp"]
mypy_path = "src"
